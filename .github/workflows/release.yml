name: Release

on:
  push:
    tags:
      - "v*"

env:
  MPLBACKEND: Agg
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  # Run the full test matrix before publishing — don't release a broken build
  test:
    name: pytest / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v9.0.0

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run python -m pytest -q

  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    needs: test          # only runs if all test jobs pass
    environment: pypi    # requires manual approval in GitHub repo settings (optional)

    permissions:
      id-token: write    # required for PyPI Trusted Publisher (OIDC — no token needed)

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v9.0.0

      - name: Build distributions
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
