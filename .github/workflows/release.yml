name: Release

on:
  push:
    tags:
      - "v*"

env:
  MPLBACKEND: Agg
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  # Run the full test matrix before publishing — don't release a broken build
  test:
    name: pytest / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v9.0.0

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run python -m pytest -q

  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    needs: test          # only runs if all test jobs pass
    environment: pypi    # requires manual approval in GitHub repo settings (optional)

    permissions:
      id-token: write    # required for PyPI Trusted Publisher (OIDC — no token needed)

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v9.0.0

      - name: Build distributions
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish       # only after the package is live on PyPI

    permissions:
      contents: write    # required to create a release

    steps:
      # No checkout needed — release notes are generated server-side by the API
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to do."
            exit 0
          fi
          # Tags carrying a suffix (v3.3.0-rc1) are prereleases, not "Latest"
          case "$TAG" in
            *-*) FLAGS=--prerelease ;;
            *)   FLAGS=--latest ;;
          esac
          gh release create "$TAG" --title "$TAG" --generate-notes $FLAGS
