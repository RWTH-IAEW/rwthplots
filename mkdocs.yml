site_name: rwthplots
site_description: RWTH Aachen University colours and styles for Matplotlib
site_author: Steffen Kortmann
site_url: https://rwth-iaew.github.io/rwthplots/
repo_url: https://github.com/RWTH-IAEW/rwthplots
repo_name: RWTH-IAEW/rwthplots

docs_dir: docs
site_dir: public

theme:
  name: material
  logo: images/iaew_logo.svg
  favicon: images/iaew_logo.svg
  language: en
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - toc.integrate

extra_css:
  - stylesheets/rwth.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Quick Start: quickstart.md
  - Style Sheets:
    - Overview: styles.md
  - Colormaps: colormaps.md
  - API Reference:
    - Colormaps: api/cmap.md
    - Formatter: api/formatter.md
    - Utilities: api/utils.md
  - Examples: examples.md
  - Changelog: changelog.md
