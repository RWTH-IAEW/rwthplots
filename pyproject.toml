[project]
name = "rwthplots"
version = "3.0.1"
description = "Adding standard themes with RWTH Aachen University colours to matplotlib"
readme = "README.md"
authors = [
    { name = "Steffen Kortmann", email = "s.kortmann@iaew.rwth-aachen.de" },
    { name = "Florian Schmidtke", email = "f.schmidtke@iaew.rwth-aachen.de" },
]
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.9.4",
    "rwth-cd-colors>=0.1.1",
]
[dependency-groups]
dev = [
    "coverage>=7.8.2",
    "pytest>=8.4.0",
    "pytest-cov>=6.1.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["rwthplots*"]

[tool.setuptools.package-dir]
"" = "src"